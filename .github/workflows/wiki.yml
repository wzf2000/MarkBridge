name: User documentation Wiki

on:
  push:
    branches: [main]
    paths:
      - docs/GETTING-STARTED.md
      - docs/TROUBLESHOOTING.md
      - docs/assets/user-guide/**
      - package.json
      - docs/RUNTIME.md
      - docs/INSTALL.md
      - docs/USAGE.md
      - docs/EMOJI-PACKS.md
      - CHANGELOG.md
      - scripts/wiki_sync.py
      - tests/test_wiki_sync.py
      - .github/workflows/wiki.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the initialized Wiki (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: markbridge-user-docs-wiki
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.generate.outputs.sha }}
      publish: ${{ steps.generate.outputs.publish }}
    steps:
      - name: Check out current main for queued publishing runs
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Test and generate a reviewable Wiki artifact
        id: generate
        env:
          REPOSITORY: ${{ github.repository }}
          WIKI_PUBLISH_REQUEST: ${{ inputs.publish && 'true' || 'false' }}
        run: |
          python3 -m unittest discover -s tests -p 'test_wiki_sync.py'
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          python3 scripts/wiki_sync.py publication-policy --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --publish "$WIKI_PUBLISH_REQUEST" >> "$GITHUB_OUTPUT"
          python3 scripts/wiki_sync.py generate --output "$RUNNER_TEMP/wiki-staging" --repository "$REPOSITORY" --sha "$sha"

      - uses: actions/upload-artifact@v7
        with:
          name: user-docs-wiki-${{ github.run_id }}
          path: ${{ runner.temp }}/wiki-staging/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: preview
    if: github.ref == 'refs/heads/main' && needs.preview.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preview.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: user-docs-wiki-${{ github.run_id }}
          path: ${{ runner.temp }}/wiki-staging/

      - name: Publish verified pages to Wiki
        env:
          WIKI_SOURCE_SHA: ${{ needs.preview.outputs.sha }}
          WIKI_AUTH_TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          GH_TERMINAL_PROMPT: '0'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -eu
          askpass="$RUNNER_TEMP/wiki-askpass.sh"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$WIKI_AUTH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          if ! git clone "https://github.com/$REPOSITORY.wiki.git" "$RUNNER_TEMP/wiki-clone"; then
            echo '::error::Wiki clone failed. Enable Wiki and save its first Home page; check WIKI_TOKEN Wiki write access. See docs/WIKI.md.'
            exit 1
          fi
          python3 scripts/wiki_sync.py apply --staging "$RUNNER_TEMP/wiki-staging" --wiki "$RUNNER_TEMP/wiki-clone" --bootstrap-home
          cd "$RUNNER_TEMP/wiki-clone"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'Wiki already matches the source.'
            exit 0
          fi
          remote_sha="$(git ls-remote "https://github.com/$REPOSITORY.git" refs/heads/main | cut -f1)"
          if [ "$remote_sha" != "$WIKI_SOURCE_SHA" ]; then
            echo '::error::Main changed during Wiki generation; rerun this workflow to publish current main.'
            exit 1
          fi
          git commit -m "Sync user docs from $WIKI_SOURCE_SHA"
          git push origin HEAD
