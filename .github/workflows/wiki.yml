name: User documentation Wiki

on:
  push:
    branches: [main]
    paths:
      - docs/INSTALL.md
      - docs/USAGE.md
      - docs/EMOJI-PACKS.md
      - CHANGELOG.md
      - scripts/wiki_sync.py
      - tests/test_wiki_sync.py
      - .github/workflows/wiki.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the initialized Wiki (main only)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: markbridge-user-docs-wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main for queued publishing runs
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test and generate a reviewable Wiki artifact
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 -m unittest discover -s tests -p 'test_wiki_sync.py'
          sha="$(git rev-parse HEAD)"
          echo "WIKI_SOURCE_SHA=$sha" >> "$GITHUB_ENV"
          python3 scripts/wiki_sync.py generate --output "$RUNNER_TEMP/wiki-staging" --repository "$REPOSITORY" --sha "$sha"

      - uses: actions/upload-artifact@v4
        with:
          name: user-docs-wiki-${{ github.run_id }}
          path: ${{ runner.temp }}/wiki-staging/
          include-hidden-files: true
          if-no-files-found: error

      - name: Publish verified pages to Wiki
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
        env:
          WIKI_AUTH_TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          GH_TERMINAL_PROMPT: '0'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -eu
          askpass="$RUNNER_TEMP/wiki-askpass.sh"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$WIKI_AUTH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          if ! git clone "https://github.com/$REPOSITORY.wiki.git" "$RUNNER_TEMP/wiki-clone"; then
            echo '::error::Wiki clone failed. Enable Wiki and save its first Home page; check WIKI_TOKEN Wiki write access. See docs/WIKI.md.'
            exit 1
          fi
          python3 scripts/wiki_sync.py apply --staging "$RUNNER_TEMP/wiki-staging" --wiki "$RUNNER_TEMP/wiki-clone" --bootstrap-home
          cd "$RUNNER_TEMP/wiki-clone"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'Wiki already matches the source.'
            exit 0
          fi
          remote_sha="$(git ls-remote "https://github.com/$REPOSITORY.git" refs/heads/main | cut -f1)"
          if [ "$remote_sha" != "$WIKI_SOURCE_SHA" ]; then
            echo '::error::Main changed during Wiki generation; rerun this workflow to publish current main.'
            exit 1
          fi
          git commit -m "Sync user docs from $WIKI_SOURCE_SHA"
          git push origin HEAD
