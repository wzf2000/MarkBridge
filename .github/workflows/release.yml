name: Manual GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (X.Y.Z or X.Y.Z-rc.N / beta.N / alpha.N)'
        required: true
        type: string
      publish:
        description: 'Create a GitHub Release (false builds downloadable artifacts only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: markbridge-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate main source and requested version
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Require main
        env:
          SOURCE_REF: ${{ github.ref }}
        run: test "$SOURCE_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin and validate dispatched commit
        id: source
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release_workflow.py --version "$RELEASE_VERSION" --sha "$SOURCE_SHA" --repository "$REPOSITORY"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Refuse an existing tag or release before building
        if: inputs.publish
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            const tag = `v${process.env.RELEASE_VERSION}`;
            for (const [method, parameters] of [
              [github.rest.git.getRef, {ref: `tags/${tag}`}],
              [github.rest.repos.getReleaseByTag, {tag}],
            ]) {
              try {
                await method({...context.repo, ...parameters});
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              throw new Error(`Refusing existing tag or release: ${tag}`);
            }

  verify:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
      release_version: ${{ inputs.version }}

  publish:
    name: Publish verified bundle
    if: inputs.publish
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout and no execution of repository/artifact code with a write token.
      - name: Download this run's verified installation bundle
        uses: actions/download-artifact@v4
        with:
          name: markbridge-release-${{ needs.resolve.outputs.sha }}
          path: release
      - name: Validate downloaded files and source identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, zipfile
          root = pathlib.Path('release')
          version, sha = os.environ['RELEASE_VERSION'], os.environ['SOURCE_SHA']
          assert re.fullmatch(r'(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:alpha|beta|rc)\.[1-9]\d*)?', version)
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          expected = {f'markbridge-{version}.zip', f'markbridge-{version}.zip.sha256', f'markbridge-{version}.manifest.json', 'release-notes.md'}
          proof = json.loads((root / 'release-validation.json').read_text())
          assert proof['version'] == version and proof['source_commit'] == sha
          assert set(proof['files']) == expected
          assert {p.name for p in root.iterdir()} == expected | {'release-validation.json'}
          for name in expected:
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == proof['files'][name]
          archive = root / f'markbridge-{version}.zip'
          assert (root / f'markbridge-{version}.zip.sha256').read_text() == f"{proof['files'][archive.name]}  {archive.name}\n"
          manifest_bytes = (root / f'markbridge-{version}.manifest.json').read_bytes()
          manifest = json.loads(manifest_bytes)
          assert manifest['schema'] == 1 and manifest['version'] == version and manifest['source_commit'] == sha
          with zipfile.ZipFile(archive) as bundle:
              names = {'markbridge/' + name for name in manifest['files']} | {'markbridge/release-manifest.json'}
              assert len(bundle.namelist()) == len(names) and set(bundle.namelist()) == names
              assert bundle.read('markbridge/release-manifest.json') == manifest_bytes
              for name, digest in manifest['files'].items():
                  assert hashlib.sha256(bundle.read('markbridge/' + name)).hexdigest() == digest
          PY
      - name: Recheck tag and release immediately before publishing
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            const tag = `v${process.env.RELEASE_VERSION}`;
            for (const [method, parameters] of [
              [github.rest.git.getRef, {ref: `tags/${tag}`}],
              [github.rest.repos.getReleaseByTag, {tag}],
            ]) {
              try {
                await method({...context.repo, ...parameters});
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              throw new Error(`Refusing existing tag or release: ${tag}`);
            }
      - name: Create draft with all assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
          # Atomically claim the tag: a concurrent existing tag makes this fail.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/v$RELEASE_VERSION" -f "sha=$SOURCE_SHA" --silent
          gh release create "v$RELEASE_VERSION" \
            --verify-tag --target "$SOURCE_SHA" --draft "${flags[@]}" \
            --title "MarkBridge $RELEASE_VERSION" --notes-file release/release-notes.md \
            "release/markbridge-$RELEASE_VERSION.zip" \
            "release/markbridge-$RELEASE_VERSION.zip.sha256" \
            "release/markbridge-$RELEASE_VERSION.manifest.json"
          tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/v$RELEASE_VERSION" --jq '.object.sha')"
          test "$tag_sha" = "$SOURCE_SHA"
          gh release edit "v$RELEASE_VERSION" --draft=false
