name: MarkBridge CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      release_version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify source and tests
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-ci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      MARKBRIDGE_CI_DB_HOST: 127.0.0.1:3306
      MARKBRIDGE_CI_DB_NAME: markbridge_ci_verify
      MARKBRIDGE_CI_DB_PASSWORD: synthetic-ci-only-password
      MARKBRIDGE_TEST_HOME: http://127.0.0.1:18764
      MARKBRIDGE_TEST_RUNTIME: ${{ github.workspace }}/.runtime/ci
    strategy:
      fail-fast: false
      matrix:
        node: ['24.15.0']
        php: ['8.2']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Set synthetic installation paths on the runner
        run: |
          {
            printf 'MARKBRIDGE_TEST_WORDPRESS_ROOT=%s/markbridge-wordpress\n' "$RUNNER_TEMP"
            printf 'MARKBRIDGE_WORDPRESS_SOURCE=%s/markbridge-wordpress\n' "$RUNNER_TEMP"
            printf 'MARKBRIDGE_TEST_WPCLI=%s/markbridge-wp\n' "$RUNNER_TEMP"
            printf 'MARKBRIDGE_TEST_PLUGIN_ROOT=%s/markbridge-wordpress/wp-content/plugins/markbridge\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, libxml, mbstring, mysqli
          tools: composer:v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python checks
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Install dependencies
        run: npm ci

      - name: Install locked PHP conversion dependencies
        run: npm run build:php

      - name: Build browser assets for the test runtime
        run: npm run build

      - name: Prepare sandbox support on the ephemeral runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap default-mysql-client
          # Ubuntu 24.04's AppArmor restriction otherwise prevents unprivileged bwrap.
          # This runner is disposable; no production host settings are changed.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build and verify the final installation package
        run: python3 scripts/package.py

      - name: Install fixed WordPress and the verified ZIP in a synthetic database
        run: |
          python3 scripts/prepare_ci_wordpress.py \
            --wordpress "$MARKBRIDGE_TEST_WORDPRESS_ROOT" \
            --downloads "$RUNNER_TEMP/markbridge-downloads" \
            --wp-cli "$MARKBRIDGE_TEST_WPCLI"
          version="$(node -p "require('./package.json').version")"
          "$MARKBRIDGE_TEST_WPCLI" --path="$MARKBRIDGE_TEST_WORDPRESS_ROOT" plugin install "dist/markbridge-$version.zip" --activate
          python3 scripts/verify_package.py "$MARKBRIDGE_TEST_PLUGIN_ROOT" --manifest "dist/markbridge-$version.manifest.json"

      - name: Prepare the real core conversion and browser runtime from the installed ZIP
        run: |
          python3 scripts/prepare_runtime.py \
            --wordpress "$MARKBRIDGE_TEST_WORDPRESS_ROOT" \
            --plugin "$MARKBRIDGE_TEST_PLUGIN_ROOT" \
            --output "$MARKBRIDGE_TEST_RUNTIME" \
            --wp-cli "$MARKBRIDGE_TEST_WPCLI"

      - name: Verify the real WordPress PHP and Node save chains
        run: |
          wp_test() { "$MARKBRIDGE_TEST_WPCLI" --path="$MARKBRIDGE_TEST_WORDPRESS_ROOT" "$@"; }
          wp_test eval-file tests/ci-backend.php php
          wp_test eval-file tests/native-rest-save.php
          wp_test eval-file tests/php-backend-save.php
          php -d disable_functions=exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec \
            "$RUNNER_TEMP/markbridge-downloads/wp-cli-2.12.0.phar" --path="$MARKBRIDGE_TEST_WORDPRESS_ROOT" eval-file tests/native-rest-save.php
          wp_test eval-file tests/ci-backend.php node
          wp_test eval-file tests/native-rest-save.php
          wp_test eval-file tests/ci-backend.php php
          wp_test eval-file tests/native-rest-save.php

      - name: Check formatting
        env:
          MARKBRIDGE_PYTHON: python
        run: npm run format:check

      - name: Run conversion and editor tests
        env:
          MARKBRIDGE_TEST_RUNTIME: ${{ github.workspace }}/.runtime/ci
        run: npm test

      - name: Install pinned Chromium for browser regressions
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run browser regressions against built plugin assets
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/browser-results.json
        run: |
          npx playwright test --retries=0 --reporter=line,json
          python3 scripts/check_browser_report.py "$RUNNER_TEMP/browser-results.json"

      - name: Upload browser failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: markbridge-browser-failures-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            ${{ runner.temp }}/browser-results.json
          if-no-files-found: ignore

      - name: Run source writeback safety tests
        run: php tests/source-writeback.php

      - name: Run bound-file CLI synchronization tests
        run: php tests/cli-source-sync.php

      - name: Run PHP worker document contract checks
        run: python3 -m unittest discover -s tests -p 'test_*backend*.py'

      - name: Run converter settings and atomic selection contracts
        run: |
          php tests/converter-settings.php
          php tests/converter-settings.php backend-constant
          php tests/converter-settings.php runtime-constant
      - name: Run display settings and presentation contracts
        run: |
          php tests/admin-settings.php
          php tests/conversion-errors.php

      - name: Check release sources and PHP syntax
        run: python3 scripts/check_release.py

      - name: Test curated Wiki synchronization
        run: python3 -m unittest discover -s tests -p 'test_wiki_sync.py'

      - name: Test manual release guards
        run: python3 -m unittest discover -s tests -p 'test_release_workflow.py'

      - name: Build and verify release package
        run: |
          rm -rf /tmp/markbridge-package-check
          mkdir -p /tmp/markbridge-package-check
          unzip -q "dist/markbridge-$(node -p "require('./package.json').version").zip" -d /tmp/markbridge-package-check
          python3 scripts/verify_package.py \
            /tmp/markbridge-package-check/markbridge \
            --manifest "dist/markbridge-$(node -p "require('./package.json').version").manifest.json"

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: markbridge-ci-${{ github.sha }}
          path: |
            plugin/assets.json
            plugin/runtime-contract.json
            plugin/vendor-manifest.json
          if-no-files-found: error

      - name: Validate immutable release bundle and prepare notes
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${RELEASE_VERSION:-$(node -p "require('./package.json').version")}"
          python3 scripts/release_workflow.py --version "$version" --sha "$SOURCE_SHA" --repository "$REPOSITORY" --bundle dist

      - name: Upload installation ZIP, checksum, external manifest and notes
        uses: actions/upload-artifact@v4
        with:
          name: markbridge-release-${{ inputs.source_sha || github.sha }}
          path: |
            dist/markbridge-*.zip
            dist/markbridge-*.zip.sha256
            dist/markbridge-*.manifest.json
            dist/release-notes.md
            dist/release-validation.json
          if-no-files-found: error

  php-converter:
    name: PHP conversion contracts (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Set up Node for build tools
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, libxml, mbstring
          tools: composer:v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build locked namespaced conversion dependencies
        run: |
          npm ci --ignore-scripts
          npm run build:php
          npm run build
      - name: Run PHP conversion and resource contracts
        run: python3 -m unittest discover -s experiments/php-converter -p 'test_*.py'
      - name: Run worker and backend selection contracts
        run: python3 -m unittest discover -s tests -p 'test_*backend*.py'
      - name: Run converter settings and atomic selection contracts
        run: |
          php tests/converter-settings.php
          php tests/converter-settings.php backend-constant
          php tests/converter-settings.php runtime-constant
      - name: Run display settings and presentation contracts
        run: |
          php tests/admin-settings.php
          php tests/conversion-errors.php
