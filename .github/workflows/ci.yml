name: MarkBridge CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      release_version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify source and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.15.0']
        php: ['8.2']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, libxml, mbstring
          tools: composer:v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python checks
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Install dependencies
        run: npm ci

      - name: Install locked PHP conversion dependencies
        run: npm run build:php

      - name: Build browser assets for the test runtime
        run: npm run build

      - name: Prepare public conversion test runtime
        run: |
          rm -rf .runtime/ci
          mkdir -p .runtime/ci/node/bin .runtime/ci/run .runtime/ci/site/wp-content/plugins/markdown-block-bridge
          cp "$(command -v node)" .runtime/ci/node/bin/node
          cp plugin/worker.cjs .runtime/ci/worker.cjs
          cp plugin/kernel.js .runtime/ci/site/wp-content/plugins/markdown-block-bridge/kernel.js
          cat > .runtime/ci/run/worker-bootstrap.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"></head><body>
          <script>
          const blockTypes = {};
          window.wp = {
            blocks: {
              registerBlockType(name, definition) { blockTypes[name] = definition; },
              registerBlockVariation() {},
              getBlockType(name) { return blockTypes[name]; },
              createBlock(name, attributes = {}, innerBlocks = []) {
                return { name, attributes, innerBlocks, isValid: true };
              },
              serialize() { return ''; },
              parse() { return []; },
            },
            blockEditor: {
              useBlockProps: () => ({}),
              useInnerBlocksProps: () => ({}),
            },
            components: { TextControl() {}, TextareaControl() {} },
            element: { Fragment: 'fragment', createElement() {}, useEffect() {}, useState() {} },
            hooks: { addFilter() {} },
            richText: { registerFormatType() {} },
          };
          </script>
          <script src="http://markbridge.invalid/wp-content/plugins/markdown-block-bridge/kernel.js"></script>
          </body></html>
          HTML
          cp runtime/package.json runtime/package-lock.json .runtime/ci/
          PATH="$PWD/.runtime/ci/node/bin:$PATH" npm ci --prefix .runtime/ci --omit=dev --ignore-scripts

      - name: Check formatting
        env:
          MARKBRIDGE_PYTHON: python
        run: npm run format:check

      - name: Run conversion and editor tests
        env:
          MARKBRIDGE_TEST_RUNTIME: ${{ github.workspace }}/.runtime/ci
        run: npm test

      - name: Install pinned Chromium for browser regressions
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run browser regressions against built plugin assets
        run: npx playwright test

      - name: Upload browser failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: markbridge-browser-failures-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      - name: Run source writeback safety tests
        run: php tests/source-writeback.php

      - name: Run bound-file CLI synchronization tests
        run: php tests/cli-source-sync.php

      - name: Run PHP worker document contract checks
        run: python3 -m unittest discover -s tests -p 'test_*backend*.py'

      - name: Run display settings and presentation contracts
        run: php tests/admin-settings.php

      - name: Check release sources and PHP syntax
        run: python3 scripts/check_release.py

      - name: Test curated Wiki synchronization
        run: python3 -m unittest discover -s tests -p 'test_wiki_sync.py'

      - name: Test manual release guards
        run: python3 -m unittest discover -s tests -p 'test_release_workflow.py'

      - name: Build and verify release package
        run: |
          python3 scripts/package.py
          rm -rf /tmp/markbridge-package-check
          mkdir -p /tmp/markbridge-package-check
          unzip -q "dist/markbridge-$(node -p "require('./package.json').version").zip" -d /tmp/markbridge-package-check
          python3 scripts/verify_package.py \
            /tmp/markbridge-package-check/markbridge \
            --manifest "dist/markbridge-$(node -p "require('./package.json').version").manifest.json"

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: markbridge-ci-${{ github.sha }}
          path: |
            plugin/assets.json
            plugin/runtime-contract.json
            plugin/vendor-manifest.json
          if-no-files-found: error

      - name: Validate immutable release bundle and prepare notes
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${RELEASE_VERSION:-$(node -p "require('./package.json').version")}"
          python3 scripts/release_workflow.py --version "$version" --sha "$SOURCE_SHA" --repository "$REPOSITORY" --bundle dist

      - name: Upload installation ZIP, checksum, external manifest and notes
        uses: actions/upload-artifact@v4
        with:
          name: markbridge-release-${{ inputs.source_sha || github.sha }}
          path: |
            dist/markbridge-*.zip
            dist/markbridge-*.zip.sha256
            dist/markbridge-*.manifest.json
            dist/release-notes.md
            dist/release-validation.json
          if-no-files-found: error

  php-converter:
    name: PHP conversion contracts (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Set up Node for build tools
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, libxml, mbstring
          tools: composer:v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build locked namespaced conversion dependencies
        run: |
          npm ci --ignore-scripts
          npm run build:php
          npm run build
      - name: Run PHP conversion and resource contracts
        run: python3 -m unittest discover -s experiments/php-converter -p 'test_*.py'
      - name: Run worker and backend selection contracts
        run: python3 -m unittest discover -s tests -p 'test_*backend*.py'
      - name: Run display settings and presentation contracts
        run: php tests/admin-settings.php
