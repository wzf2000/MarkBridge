name: MarkBridge CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      release_version:
        type: string
        required: true
    outputs:
      release_artifact_id:
        description: Verified release artifact ID
        value: ${{ jobs.verify.outputs.release_artifact_id }}
      release_artifact_digest:
        description: Verified release artifact digest
        value: ${{ jobs.verify.outputs.release_artifact_digest }}

permissions:
  contents: read

# Only a newer commit on the same PR cancels work. Main and reusable release
# invocations have a unique run identity and are never cancelled by another run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && !inputs.source_sha && format('markbridge-pr-{0}', github.event.pull_request.number) || format('markbridge-ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.source_sha }}

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  build:
    name: Build trusted installation inputs
    outputs:
      artifact_id: ${{ steps.build-inputs.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-tools
      - name: Build locked PHP dependencies and browser assets
        run: |
          npm run build:php
          npm run build
      - name: Build final ZIP from clean source
        run: python3 scripts/package.py
      - name: Discover every registered browser test and project
        env:
          MARKBRIDGE_CROSS_BROWSER: '1'
          MARKBRIDGE_BROWSER_REPORT: ${{ runner.temp }}/browser-discovery.json
        run: |
          npx playwright test --list --reporter=./scripts/ci-browser-reporter.cjs
          python3 scripts/check_ci_pipeline.py discover --sha "$SOURCE_SHA" --input "$RUNNER_TEMP/browser-discovery.json" --output dist/browser-discovery.json
      # This is an internal input, never an already verified release artifact.
      - id: build-inputs
        uses: actions/upload-artifact@v7
        with:
          name: markbridge-build-${{ inputs.source_sha || github.sha }}
          path: |
            dist/markbridge-*.zip
            dist/markbridge-*.zip.sha256
            dist/markbridge-*.manifest.json
            dist/browser-discovery.json
          overwrite: ${{ github.run_attempt > 1 }}
          if-no-files-found: error

  save:
    name: Real PHP to Node to PHP save chains
    needs: build
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-ci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-tools
      - name: Download internal build inputs from this run
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
      - name: Verify ZIP and external manifest, then restore generated test assets
        run: python3 scripts/prepare_ci_package.py --bundle dist --sha "$SOURCE_SHA" --hydrate
      - uses: ./.github/actions/ci-wordpress
      - name: Verify the real WordPress PHP and Node save chains
        run: |
          wp_test() { "$MARKBRIDGE_TEST_WPCLI" --path="$MARKBRIDGE_TEST_WORDPRESS_ROOT" "$@"; }
          wp_test eval-file tests/ci-backend.php php
          wp_test eval-file tests/native-rest-save.php
          wp_test eval-file tests/teaching-save.php
          wp_test eval-file tests/provider-save.php
          wp_test eval-file tests/php-backend-save.php
          wp_test eval-file tests/recovery-save.php
          wp_test eval-file tests/frontmatter-save.php
          wp_test eval-file tests/resource-import-save.php
          wp_test eval-file tests/code-tabs-save.php
          wp_test eval-file tests/export-save.php
          wp_test eval-file tests/merge-save.php
          wp_test eval-file tests/block-adapters-save.php
          wp_test eval-file tests/native-group-save.php
          wp_test eval-file tests/native-text-save.php
          wp_test eval-file tests/localization-save.php
          wp_test eval-file tests/authoring-save.php
          wp_test eval-file tests/technical-writing-save.php
          wp_test eval-file tests/native-media-save.php
          wp_test eval-file tests/batch-save.php
          wp_test eval-file tests/paired-backups-save.php
          wp_test eval-file tests/references-save.php
          wp_test eval-file tests/collections-save.php
          php -d disable_functions=exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec \
            "$RUNNER_TEMP/markbridge-downloads/wp-cli-2.12.0.phar" --path="$MARKBRIDGE_TEST_WORDPRESS_ROOT" eval-file tests/native-rest-save.php
          wp_test eval-file tests/ci-backend.php node
          wp_test eval-file tests/native-rest-save.php
          wp_test eval-file tests/teaching-save.php
          wp_test eval-file tests/provider-save.php
          wp_test eval-file tests/recovery-save.php
          wp_test eval-file tests/frontmatter-save.php
          wp_test eval-file tests/resource-import-save.php
          wp_test eval-file tests/code-tabs-save.php
          wp_test eval-file tests/export-save.php
          wp_test eval-file tests/merge-save.php
          wp_test eval-file tests/block-adapters-save.php
          wp_test eval-file tests/native-group-save.php
          wp_test eval-file tests/native-text-save.php
          wp_test eval-file tests/localization-save.php
          wp_test eval-file tests/authoring-save.php
          wp_test eval-file tests/technical-writing-save.php
          wp_test eval-file tests/native-media-save.php
          wp_test eval-file tests/batch-save.php
          wp_test eval-file tests/paired-backups-save.php
          wp_test eval-file tests/references-save.php
          wp_test eval-file tests/collections-save.php
          wp_test eval-file tests/ci-backend.php php
          wp_test eval-file tests/native-rest-save.php
          wp_test eval-file tests/teaching-save.php
          wp_test eval-file tests/provider-save.php
          wp_test eval-file tests/recovery-save.php
          wp_test eval-file tests/frontmatter-save.php
          wp_test eval-file tests/resource-import-save.php
          wp_test eval-file tests/code-tabs-save.php
          wp_test eval-file tests/export-save.php
          wp_test eval-file tests/merge-save.php
          wp_test eval-file tests/block-adapters-save.php
          wp_test eval-file tests/native-group-save.php
          wp_test eval-file tests/native-text-save.php
          wp_test eval-file tests/localization-save.php
          wp_test eval-file tests/authoring-save.php
          wp_test eval-file tests/technical-writing-save.php
          wp_test eval-file tests/native-media-save.php
          wp_test eval-file tests/batch-save.php
          wp_test eval-file tests/paired-backups-save.php
          wp_test eval-file tests/references-save.php
          wp_test eval-file tests/collections-save.php

  unit:
    name: Conversion, source and static contracts
    needs: build
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-ci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-tools
      - name: Download internal build inputs from this run
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
      - name: Verify ZIP and external manifest, then restore generated test assets
        run: python3 scripts/prepare_ci_package.py --bundle dist --sha "$SOURCE_SHA" --hydrate
      - uses: ./.github/actions/ci-wordpress
      - name: Check formatting
        env:
          MARKBRIDGE_PYTHON: python
        run: npm run format:check
      - name: Run conversion and editor tests
        run: npm test
      - name: Run source writeback safety tests
        run: php tests/source-writeback.php

      - name: Run bound-file CLI synchronization tests
        run: php tests/cli-source-sync.php

      - name: Run PHP worker document contract checks
        run: python3 -m unittest discover -s tests -p 'test_*backend*.py'

      - name: Run converter settings and atomic selection contracts
        run: |
          php tests/converter-settings.php
          php tests/converter-settings.php backend-constant
          php tests/converter-settings.php runtime-constant
      - name: Run display settings and presentation contracts
        run: |
          php tests/admin-settings.php
          php tests/conversion-errors.php
          php tests/local-recovery.php
          php tests/frontmatter.php

      - name: Check release sources and PHP syntax
        run: python3 scripts/check_release.py

      - name: Test anonymous component delivery probe
        run: python3 -m unittest discover -s tests -p 'test_delivery_probe.py'

      - name: Test curated Wiki synchronization and CI save coverage
        run: |
          python3 -m unittest discover -s tests -p 'test_wiki_sync.py'
          python3 -m unittest discover -s tests -p 'test_ci_workflow.py'

      - name: Verify translation catalog and synthetic core locale setup
        run: |
          python3 scripts/build-localization.py --check
          python3 -m unittest discover -s tests -p 'test_ci_locales.py'

      - name: Test manual release guards
        run: |
          python3 -m unittest discover -s tests -p 'test_release_workflow.py'
          python3 -m unittest discover -s tests -p 'test_package_limits.py'
          python3 -m unittest discover -s tests -p 'test_package_source.py'
          python3 -m unittest discover -s tests -p 'test_vendor_resources.py'
          php -d disable_functions=mb_check_encoding tests/i18n-bootstrap.php

  browser:
    name: Browser regressions (${{ matrix.group }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: chromium-desktop
            projects: --project=desktop-chromium
            install: --only-shell chromium
          - group: chromium-mobile
            projects: --project=mobile-chromium
            install: --only-shell chromium
          - group: compatibility
            projects: --project=desktop-firefox --project=mobile-firefox --project=desktop-webkit --project=mobile-webkit
            install: firefox webkit
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-ci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ci-tools
      - name: Download internal build inputs from this run
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
      - name: Verify ZIP and external manifest, then restore generated test assets
        run: python3 scripts/prepare_ci_package.py --bundle dist --sha "$SOURCE_SHA" --hydrate
      - uses: ./.github/actions/ci-wordpress
      - name: Install pinned browsers for this group
        run: npx playwright install --with-deps ${{ matrix.install }}
      - name: Run every registered test in this group
        env:
          MARKBRIDGE_CROSS_BROWSER: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/browser-results.json
          MARKBRIDGE_BROWSER_REPORT: ${{ runner.temp }}/browser-coverage.json
        run: npx playwright test ${{ matrix.projects }} --retries=0 --reporter=line,json,./scripts/ci-browser-reporter.cjs
      - name: Verify exact browser test identities and write timing report
        if: always()
        run: >-
          python3 scripts/check_ci_pipeline.py report --sha "$SOURCE_SHA"
          --discovery dist/browser-discovery.json --group "${{ matrix.group }}"
          --input "$RUNNER_TEMP/browser-coverage.json"
          --output "$RUNNER_TEMP/browser-${{ matrix.group }}.json"
      - name: Upload browser timing and coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: markbridge-browser-coverage-${{ matrix.group }}-${{ inputs.source_sha || github.sha }}
          path: ${{ runner.temp }}/browser-${{ matrix.group }}.json
          overwrite: ${{ github.run_attempt > 1 }}
          if-no-files-found: error
      - name: Upload browser failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: markbridge-browser-failures-${{ matrix.group }}-${{ inputs.source_sha || github.sha }}
          path: |
            test-results/
            playwright-report/
            ${{ runner.temp }}/browser-results.json
          overwrite: ${{ github.run_attempt > 1 }}
          if-no-files-found: ignore

  php-converter:
    name: PHP conversion contracts (${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Set up Node for build tools
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, libxml, mbstring, zip, intl, gd, posix
          tools: composer:v2
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install translation compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext
      - name: Build locked namespaced conversion dependencies
        run: |
          npm ci --ignore-scripts
          npm run build:php
          npm run build
      - name: Run PHP conversion and resource contracts
        run: python3 -m unittest discover -s experiments/php-converter -p 'test_*.py'
      - name: Run worker and backend selection contracts
        run: python3 -m unittest discover -s tests -p 'test_*backend*.py'
      - name: Run converter settings and atomic selection contracts
        run: |
          php tests/converter-settings.php
          php tests/converter-settings.php backend-constant
          php tests/converter-settings.php runtime-constant
      - name: Run display settings and presentation contracts
        run: |
          php tests/admin-settings.php
          php tests/conversion-errors.php
          php tests/local-recovery.php
          php tests/frontmatter.php
          php tests/resource-import.php
          php tests/code-tabs.php
          php tests/export.php
          php tests/merge.php
          php tests/block-adapters.php
          php tests/localization.php

  verify:
    # Keep the original check name stable for branch protection.
    name: Verify source and tests
    outputs:
      release_artifact_id: ${{ steps.release.outputs.artifact-id }}
      # upload-artifact returns hex; the REST artifact digest includes this prefix.
      release_artifact_digest: ${{ format('sha256:{0}', steps.release.outputs.artifact-digest) }}
    if: always()
    needs: [build, save, unit, browser, php-converter]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Require every independent job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['JOB_RESULTS'])
          assert set(results) == {'build', 'save', 'unit', 'browser', 'php-converter'}
          assert all(job['result'] == 'success' for job in results.values()), results
          PY
      - name: Download this run's internal build inputs
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
      - name: Download this run's browser timing reports
        uses: actions/download-artifact@v8
        with:
          pattern: markbridge-browser-coverage-*-${{ inputs.source_sha || github.sha }}
          path: ${{ runner.temp }}/browser-reports
          merge-multiple: true
      - name: Require complete unique browser coverage for the same source
        run: >-
          python3 scripts/check_ci_pipeline.py gate --sha "$SOURCE_SHA"
          --discovery dist/browser-discovery.json --reports "$RUNNER_TEMP/browser-reports"
          --output "$RUNNER_TEMP/pipeline-report.json"
      - name: Upload complete browser timing summary
        uses: actions/upload-artifact@v7
        with:
          name: markbridge-ci-${{ inputs.source_sha || github.sha }}
          path: ${{ runner.temp }}/pipeline-report.json
          overwrite: ${{ github.run_attempt > 1 }}
          if-no-files-found: error
      - name: Validate immutable release bundle and prepare notes
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${RELEASE_VERSION:-$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')}"
          python3 scripts/release_workflow.py --version "$version" --sha "$SOURCE_SHA" --repository "$REPOSITORY" --bundle dist
      - name: Upload installation ZIP, checksum, external manifest and notes
        id: release
        uses: actions/upload-artifact@v7
        with:
          name: markbridge-release-${{ inputs.source_sha || github.sha }}
          path: |
            dist/markbridge-*.zip
            dist/markbridge-*.zip.sha256
            dist/markbridge-*.manifest.json
            dist/release-notes.md
            dist/release-validation.json
          overwrite: ${{ github.run_attempt > 1 }}
          if-no-files-found: error
